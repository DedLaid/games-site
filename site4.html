<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Игры из базы данных</title>

    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- ========================================== -->
<!-- ФОРМА ДОБАВЛЕНИЯ ИГРЫ                       -->
<!-- ========================================== -->
<section class="add-game-section">
    <h2>➕ Добавить новую игру</h2>
    
    <form id="add-game-form">
        
        <!-- Название -->
        <div class="form-group">
            <label for="title">Название игры:</label>
            <input 
                type="text" 
                id="title" 
                placeholder="Например: Cyberpunk 2077" 
                required>
        </div>
        
        <!-- Жанр -->
        <div class="form-group">
            <label for="genre">Жанр:</label>
            <input 
                type="text" 
                id="genre" 
                placeholder="Например: RPG" 
                required>
        </div>
        
        <!-- Рейтинг -->
        <div class="form-group">
            <label for="rating">Рейтинг (0-10):</label>
            <input 
                type="number" 
                id="rating" 
                min="0" 
                max="10" 
                step="0.1" 
                placeholder="9.5" 
                required>
        </div>
        
        <!-- Ссылка на картинку -->
        <div class="form-group">
            <label for="imageUrl">Ссылка на картинку:</label>
            <input 
                type="url" 
                id="imageUrl" 
                placeholder="https://example.com/image.jpg">
        </div>
        
        <!-- Кнопка -->
        <button type="submit" class="submit-btn">Сохранить игру</button>
        
    </form>
</section>














    <!-- ========================================== -->
    <!-- БЛОК С КАРТОЧКАМИ ИГР (данные из Firestore) -->
    <!-- ========================================== -->
    <h2 style="text-align: center;">🎮 Наши игры</h2>

    <!-- Сюда JavaScript будет добавлять карточки -->
    <div class="card-container" id="games-container">
        <p id="loading">Загрузка игр...</p>
    </div>

    <!-- Подключение JavaScript -->
    <script src="js/script.js"></script>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js';
        import { getFirestore } from 'https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js';

        const firebaseConfig = {
            apiKey: "AIzaSyAx4GtZ1fOh0i_5isXBfpP5cTe13chDy_4",
            authDomain: "mygamesite-207fa.firebaseapp.com",
            projectId: "mygamesite-207fa",
            storageBucket: "mygamesite-207fa.firebasestorage.app",
            messagingSenderId: "990227201280",
            appId: "1:990227201280:web:6f95efd3fd3ca9567a07e5"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        console.log('✅ Firebase подключен!');

        // Делаем db доступной глобально (для отладки)
        window.firebaseConfig = firebaseConfig;
        window.db = db;
        window.firebaseReady = true;
    </script>




<!-- ========================================== -->
<!-- МОДАЛЬНОЕ ОКНО ДЛЯ РЕДАКТИРОВАНИЯ          -->
<!-- ========================================== -->
<div class="modal-overlay" id="edit-modal">
    <div class="modal-window">
        <h2>✏️ Редактировать игру</h2>
        
        <form id="edit-form">
            <input type="hidden" id="edit-id">
            
            <div class="form-group">
                <label for="edit-title">Название игры:</label>
                <input type="text" id="edit-title" required>
            </div>
            
            <div class="form-group">
                <label for="edit-genre">Жанр:</label>
                <input type="text" id="edit-genre" required>
            </div>
            
            <div class="form-group">
                <label for="edit-rating">Рейтинг (0-10):</label>
                <input type="number" id="edit-rating" min="0" max="10" step="0.1" required>
            </div>
            
            <div class="form-group">
                <label for="edit-imageUrl">Ссылка на картинку:</label>
                <input type="url" id="edit-imageUrl">
            </div>
            
            <div class="modal-actions">
                <button type="button" class="cancel-btn" id="cancel-edit">Отмена</button>
                <button type="submit" class="save-btn">Сохранить</button>
            </div>
        </form>
    </div>
</div>

</body>
</html>
